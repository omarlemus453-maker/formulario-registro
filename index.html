<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <!-- Importación de Bootstrap CSS desde CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm p-4">
      <h2 class="text-center mb-4 text-primary">Formulario de Registro</h2>
      
      <form>
        <!-- Campo Nombre -->
        <div class="mb-3">
          <label for="nombre" class="form-label font-weight-bold">Nombre Completo:</label>
          <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre">
        </div>

        <!-- Campo Carné -->
        <div class="mb-3">
          <label for="carne" class="form-label font-weight-bold">No. de carné:</label>
          <input type="text" class="form-control" id="carne" placeholder="Ingrese su carné">
        </div>

        <!-- Campo Género (Radio buttons) -->
        <div class="mb-3">
          <label class="form-label font-weight-bold d-block">Género:</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="genero" id="masculino" value="Masculino">
            <label class="form-check-label" for="masculino">Masculino</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="genero" id="femenino" value="Femenino">
            <label class="form-check-label" for="femenino">Femenino</label>
          </div>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" class="btn btn-primary w-100">Registrar</button>
      </form>
    </div>
  </div>

  <!-- Importación de Bootstrap JS desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
