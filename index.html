<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm p-4">
      <h2 class="text-center mb-4 text-primary">Formulario de Registro</h2>
      
      <!-- Formulario con ID para JavaScript -->
      <form id="miFormulario">
        <!-- Campo Nombre -->
        <div class="mb-3">
          <label for="nombre" class="form-label font-weight-bold">Nombre Completo:</label>
          <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre" required>
        </div>

        <!-- Campo Carné -->
        <div class="mb-3">
          <label for=" No. de carné" class="form-label font-weight-bold">Carné:</label>
          <input type="text" class="form-control" id="carne" placeholder="Ingrese su carné" required>
        </div>

        <!-- Campo Género -->
        <div class="mb-3">
          <label class="form-label font-weight-bold d-block">Género:</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="genero" id="masculino" value="Masculino" required>
            <label class="form-check-label" for="masculino">Masculino</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="genero" id="femenino" value="Femenino" required>
            <label class="form-check-label" for="femenino">Femenino</label>
          </div>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" class="btn btn-primary w-100">Registrar</button>
      </form>

      <!-- Recuadro donde se mostrarán los datos registrados -->
      <div id="resultado" class="alert alert-success mt-4 d-none">
        <h5 class="alert-heading">¡Datos Registrados!</h5>
        <hr>
        <p class="mb-1"><strong>Nombre:</strong> <span id="resNombre"></span></p>
        <p class="mb-1"><strong>Carné:</strong> <span id="resCarne"></span></p>
        <p class="mb-0"><strong>Género:</strong> <span id="resGenero"></span></p>
      </div>
    </div>
  </div>

  <!-- Script para procesar el formulario -->
  <script>
    document.getElementById('miFormulario').addEventListener('submit', function(event) {
      event.preventDefault(); // Evita que la página se recargue

      // Capturar los valores ingresados
      const nombre = document.getElementById('nombre').value;
      const carne = document.getElementById('carne').value;
      const genero = document.querySelector('input[name="genero"]:checked').value;

      // Asignar los valores al recuadro de resultado
      document.getElementById('resNombre').textContent = nombre;
      document.getElementById('resCarne').textContent = carne;
      document.getElementById('resGenero').textContent = genero;

      // Mostrar el recuadro verde de resultado
      document.getElementById('resultado').classList.remove('d-none');
    });
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
